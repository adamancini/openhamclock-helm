name: Lint and Test

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/lint-test.yml'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/lint-test.yml'

jobs:
  lint-chart:
    name: Lint chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: helm lint --strict
        run: helm lint --strict charts/openhamclock

      - name: helm template (default values)
        run: helm template test charts/openhamclock

      - name: helm template (kitchen sink values)
        run: |
          helm template test charts/openhamclock \
            --set ingress.enabled=true \
            --set ingress.host=clock.example.com \
            --set udpServices.enabled=true \
            --set udpServices.n1mm.enabled=true \
            --set existingSecret=my-secret \
            --set persistence.enabled=false

  validate-kubernetes:
    name: Validate rendered manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Render and validate (default values)
        run: helm template test charts/openhamclock | kubeconform -strict -summary

      - name: Render and validate (kitchen sink values)
        run: |
          helm template test charts/openhamclock \
            --set ingress.enabled=true \
            --set ingress.host=clock.example.com \
            --set udpServices.enabled=true \
            --set udpServices.n1mm.enabled=true \
            --set existingSecret=my-secret \
            --set persistence.enabled=false \
            | kubeconform -strict -summary
